name: Instalador Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar NAPS2 Console
        shell: pwsh
        run: |
          $release = Invoke-RestMethod 'https://api.github.com/repos/cyanfish/naps2/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'win-x64.*portable.*zip$|win-x64.*zip$' } | Select-Object -First 1
          if (-not $asset) { throw 'Pacote portátil NAPS2 Windows x64 não encontrado.' }
          Invoke-WebRequest $asset.browser_download_url -OutFile naps2.zip
          Expand-Archive naps2.zip -DestinationPath .local/naps2-download
          $console = Get-ChildItem .local/naps2-download -Recurse -Filter NAPS2.Console.exe | Select-Object -First 1
          if (-not $console) { throw 'NAPS2.Console.exe ausente no pacote.' }
          New-Item -ItemType Directory -Force .local/naps2-cli/App | Out-Null
          Copy-Item "$($console.Directory.FullName)/*" .local/naps2-cli/App -Recurse -Force

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar interface
        run: npm run build

      - name: Gerar instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: CotrimScan-Windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
