name: Instalador Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar interface
        run: npm run build

      - name: Gerar instalador
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: CotrimScan-Windows
          path: dist/*.exe
          if-no-files-found: error
